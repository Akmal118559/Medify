<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Medify</title>
<style>
:root{
  --bg:#F0FDFA;
  --surface:#FFFFFF;
  --ink:#0F2724;
  --ink-soft:#3F5C58;
  --ink-faint:#5B7B77;
  --primary:#0891B2;
  --primary-dark:#066A80;
  --primary-tint:#E1F4F7;
  --accent:#16A34A;
  --accent-dark:#128040;
  --accent-tint:#E3F6EA;
  --line:#CFE9E6;
  --line-soft:#E3F4F2;
  --danger:#DC2626;
  --danger-tint:#FBE8E7;
  --ok:#16A34A;
  --ok-tint:#E3F6EA;
  --star:#D97F06;
  --radius-s:9px;
  --radius-m:15px;
  --radius-l:24px;
  --font-head:'Figtree', -apple-system, sans-serif;
  --font-body:'Noto Sans', -apple-system, sans-serif;
  --shadow-card:0 1px 2px rgba(15,39,36,0.07), 0 1px 0 rgba(15,39,36,0.04);
  --shadow-hover:0 10px 24px rgba(15,39,36,0.10), 0 2px 6px rgba(15,39,36,0.06);
  --touch:44px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0B1917;
    --surface:#122522;
    --ink:#EAF6F4;
    --ink-soft:#A9C7C2;
    --ink-faint:#7FA29D;
    --primary:#3FC2DC;
    --primary-dark:#7FDCEF;
    --primary-tint:#12302E;
    --accent:#4ADE80;
    --accent-dark:#7EEFA8;
    --accent-tint:#123424;
    --line:#1F3B37;
    --line-soft:#182E2B;
    --danger:#F0908A;
    --danger-tint:#3A1E1C;
    --ok:#4ADE80;
    --ok-tint:#123424;
    --star:#F0B94D;
    --shadow-card:0 1px 2px rgba(0,0,0,.35);
    --shadow-hover:0 10px 24px rgba(0,0,0,.42);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1917; --surface:#122522; --ink:#EAF6F4; --ink-soft:#A9C7C2; --ink-faint:#7FA29D;
  --primary:#3FC2DC; --primary-dark:#7FDCEF; --primary-tint:#12302E;
  --accent:#4ADE80; --accent-dark:#7EEFA8; --accent-tint:#123424;
  --line:#1F3B37; --line-soft:#182E2B; --danger:#F0908A; --danger-tint:#3A1E1C;
  --ok:#4ADE80; --ok-tint:#123424; --star:#F0B94D; --shadow-card:0 1px 2px rgba(0,0,0,.35); --shadow-hover:0 10px 24px rgba(0,0,0,.42);
}
*{box-sizing:border-box;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;} }
html{scroll-padding-top:76px;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
  font-size:16px;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;margin:0;color:var(--ink);letter-spacing:-0.01em;line-height:1.2;}
.container{max-width:1180px;margin:0 auto;padding:0 20px;}
::selection{background:var(--accent-tint);}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px;}
svg.ic{flex-shrink:0;}

/* Icon-bearing interactive elements get a pointer + min touch target */
a,button,.spec-card,.chip,.day-tab,.slot-btn,.tab-btn{cursor:pointer;}

/* Header */
header.site{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
.header-row{display:flex;align-items:center;gap:20px;padding:14px 20px;max-width:1180px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-head);font-size:21px;font-weight:800;color:var(--primary-dark);flex-shrink:0;}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;}
nav.main-nav{display:flex;gap:2px;flex:1;}
nav.main-nav a{padding:10px 12px;border-radius:var(--radius-s);font-size:14.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;min-height:var(--touch);display:flex;align-items:center;}
nav.main-nav a:hover{background:var(--line-soft);color:var(--ink);}
nav.main-nav a.active{color:var(--primary-dark);background:var(--primary-tint);}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{width:var(--touch);height:var(--touch);border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .15s,color .15s,background .15s;flex-shrink:0;}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);}
.icon-btn-danger{color:var(--danger);border-color:var(--danger);}
.mobile-nav-btn{display:none;}
.mobile-nav-overlay{position:fixed;inset:0;background:rgba(10,25,22,.5);z-index:90;display:flex;justify-content:flex-end;}
.mobile-nav-panel{width:min(300px,84vw);height:100%;background:var(--surface);padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));overflow-y:auto;display:flex;flex-direction:column;gap:3px;}
.mobile-nav-panel a{padding:13px 14px;border-radius:var(--radius-s);font-size:15px;font-weight:600;color:var(--ink);min-height:48px;display:flex;align-items:center;gap:10px;}
.mobile-nav-panel a.active{background:var(--primary-tint);color:var(--primary-dark);}
.mobile-nav-panel a.danger{color:var(--danger);}
@media (max-width: 980px){
  .mobile-nav-btn{display:flex;}
}
@media (max-width: 640px){
  .icon-btn-danger, .header-fav-btn{display:none;}
  .header-actions{gap:6px;}
  .header-row{padding-left:16px;padding-right:16px;gap:10px;}
  .logo{font-size:18px;}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:var(--radius-s);font-size:14.5px;font-weight:700;border:1px solid transparent;transition:filter .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;min-height:var(--touch);font-family:var(--font-head);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(8,145,178,.25);}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(8,145,178,.28);transform:translateY(-1px);}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(22,163,74,.25);}
.btn-accent:hover{background:var(--accent-dark);box-shadow:0 4px 12px rgba(22,163,74,.28);transform:translateY(-1px);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary-dark);}
.btn-ghost{background:transparent;color:var(--ink-soft);padding:10px 12px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:8px 14px;font-size:13.5px;min-height:38px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Hero */
.hero{background:linear-gradient(180deg, var(--primary-tint) 0%, var(--bg) 100%);border-bottom:1px solid var(--line);}
.hero-inner{max-width:1180px;margin:0 auto;padding:52px 20px 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;}
.eyebrow-note{font-size:13.5px;color:var(--primary-dark);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.hero h1{font-size:clamp(28px,3.6vw,42px);line-height:1.14;max-width:17ch;}
.hero p.lead{font-size:16.5px;color:var(--ink-soft);margin:16px 0 26px;max-width:48ch;}
.search-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px;box-shadow:var(--shadow-hover);}
.search-row{display:flex;gap:10px;}
.search-input-wrap{flex:1;position:relative;}
.search-input-wrap input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:var(--radius-s);font-size:15px;background:var(--bg);color:var(--ink);font-family:inherit;min-height:var(--touch);}
.search-input-wrap input:focus{outline:2px solid var(--primary);outline-offset:-1px;background:var(--surface);}
.search-input-wrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
.search-examples{margin-top:12px;font-size:12.5px;color:var(--ink-faint);}
.search-examples b{color:var(--ink-soft);font-weight:600;}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface);display:inline-flex;align-items:center;gap:6px;min-height:36px;}
.chip:hover{border-color:var(--primary);color:var(--primary-dark);}
.symptom-cta{margin-top:16px;border:1.5px dashed var(--accent);background:var(--accent-tint);border-radius:var(--radius-m);padding:14px 16px;display:flex;align-items:center;gap:12px;}
.symptom-cta .icwrap{width:38px;height:38px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent-dark);flex-shrink:0;}
.symptom-cta .txt{flex:1;font-size:13.5px;color:var(--ink-soft);}
.symptom-cta b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:2px;font-family:var(--font-head);}
.hero-art{display:flex;justify-content:center;align-items:center;}
.hero-art svg{width:100%;max-width:360px;height:auto;}

.section{padding:44px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;}
.section-head h2{font-size:25px;}
.section-head p{color:var(--ink-soft);font-size:14.5px;margin-top:6px;}
.link-more{font-size:13.5px;font-weight:700;color:var(--primary-dark);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;min-height:var(--touch);}
.link-more:hover{text-decoration:underline;}

.spec-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.spec-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px 10px;text-align:center;transition:border-color .15s,transform .15s,box-shadow .15s;}
.spec-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.spec-card .ic{color:var(--primary);margin:0 auto 8px;width:26px;height:26px;}
.spec-card .nm{font-size:12.5px;font-weight:700;color:var(--ink);font-family:var(--font-head);}
.spec-card .ct{font-size:11px;color:var(--ink-faint);margin-top:2px;}

.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.card-grid.cols-4{grid-template-columns:repeat(4,1fr);}

.doc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;height:100%;transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;}
.doc-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--line-soft);}
.doc-top{display:flex;gap:12px;}
.avatar{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;color:#fff;}
.doc-name{font-weight:700;font-size:15.5px;color:var(--ink);font-family:var(--font-head);}
.doc-spec{font-size:13px;color:var(--primary-dark);font-weight:600;margin-top:1px;display:flex;align-items:center;gap:5px;}
.doc-clinic{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
.rating-row{display:flex;align-items:center;gap:5px;font-size:13px;margin-top:9px;}
.stars{display:flex;gap:1px;color:var(--star);}
.rating-num{font-weight:700;color:var(--ink);}
.rating-count{color:var(--ink-faint);}
.doc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{font-size:11.5px;padding:4px 9px;border-radius:20px;background:var(--line-soft);color:var(--ink-soft);font-weight:600;}
.doc-about{font-size:13px;color:var(--ink-soft);margin-top:10px;flex:1;}
.doc-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);}
.price-slot{font-size:12px;color:var(--ink-faint);}
.price{font-weight:800;font-size:15px;color:var(--ink);font-family:var(--font-head);}
.slot-next{font-size:12px;color:var(--ok);font-weight:700;margin-top:1px;display:flex;align-items:center;gap:4px;justify-content:flex-end;}
.doc-btns{display:flex;gap:8px;margin-top:12px;}

.clinic-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;box-shadow:var(--shadow-card);display:flex;flex-direction:column;height:100%;transition:box-shadow .18s ease, transform .18s ease;}
.clinic-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}
.clinic-photo{height:118px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;}
.clinic-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;}
.clinic-name{font-weight:700;font-size:15px;font-family:var(--font-head);}
.clinic-addr{font-size:12.5px;color:var(--ink-faint);margin-top:3px;display:flex;gap:5px;align-items:flex-start;}
.clinic-foot{margin-top:auto;padding-top:12px;}

.review-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;}
.rev-head{display:flex;justify-content:space-between;align-items:center;}
.rev-author{font-weight:700;font-size:13.5px;font-family:var(--font-head);}
.rev-date{font-size:12px;color:var(--ink-faint);}
.rev-text{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}

section.strip{background:var(--primary-dark);color:#fff;padding:38px 0;}
.strip .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;}
.strip h3{color:#fff;font-size:21px;max-width:32ch;}
.strip p{color:rgba(255,255,255,.82);font-size:14px;margin-top:6px;}
.strip-list{display:flex;gap:10px;flex-wrap:wrap;}
.strip-item{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px 14px;border-radius:var(--radius-s);font-size:13.5px;font-weight:600;}
.strip-item:hover{background:rgba(255,255,255,.18);}

footer.site{border-top:1px solid var(--line);padding:36px 0 30px;margin-top:20px;}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:26px;}
.foot-grid h4{font-size:13px;color:var(--ink-faint);font-weight:700;margin-bottom:10px;font-family:var(--font-head);}
.foot-grid a{display:flex;align-items:center;font-size:13.5px;color:var(--ink-soft);padding:5px 0;min-height:30px;}
.foot-grid a:hover{color:var(--primary);}
.foot-bottom{margin-top:26px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-faint);}

.page-head{padding:28px 0 18px;border-bottom:1px solid var(--line);background:var(--surface);}
.breadcrumb{font-size:12.5px;color:var(--ink-faint);margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.breadcrumb a:hover{color:var(--primary);}

.filters-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:20px;}
select{font-family:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);font-size:13.5px;background:var(--surface);color:var(--ink);min-height:var(--touch);}
.filter-toggle{display:flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--line);border-radius:20px;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface);min-height:var(--touch);}
.filter-toggle.active{background:var(--primary-tint);border-color:var(--primary);color:var(--primary-dark);}
.results-count{font-size:13.5px;color:var(--ink-faint);margin-left:auto;}
.list-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint);}
.empty-state .ic{color:var(--ink-faint);margin:0 auto 14px;width:40px;height:40px;}
.empty-state h3{color:var(--ink-soft);font-size:17px;margin-bottom:6px;}

.doc-hero{display:grid;grid-template-columns:200px 1fr;gap:28px;padding:30px 0;}
.doc-hero-avatar{width:190px;height:190px;border-radius:var(--radius-l);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:54px;color:#fff;font-weight:700;}
.doc-hero-info h1{font-size:27px;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.pill{font-size:12.5px;padding:6px 12px;border-radius:20px;background:var(--primary-tint);color:var(--primary-dark);font-weight:700;display:inline-flex;align-items:center;gap:5px;}
.info-grid{display:grid;grid-template-columns:2fr 1fr;gap:30px;padding-bottom:40px;}
.info-block{margin-bottom:28px;}
.info-block h3{font-size:17px;margin-bottom:12px;}
.info-block p{color:var(--ink-soft);font-size:14.5px;}
.kv-list{display:flex;flex-direction:column;gap:11px;}
.kv-row{display:flex;gap:10px;font-size:14px;align-items:flex-start;}
.kv-row .ic{color:var(--ink-faint);margin-top:2px;flex-shrink:0;}
.kv-row .k{color:var(--ink-faint);min-width:110px;flex-shrink:0;}
.kv-row .v{color:var(--ink);}
.sidebar-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;position:sticky;top:80px;}
.sidebar-card h4{font-size:15px;margin-bottom:12px;}

.day-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
.day-tab{flex-shrink:0;padding:9px 13px;border:1px solid var(--line);border-radius:var(--radius-s);text-align:center;font-size:12.5px;min-width:52px;background:var(--surface);min-height:52px;}
.day-tab .dow{color:var(--ink-faint);font-size:10.5px;text-transform:lowercase;}
.day-tab .dnum{font-weight:700;font-size:15px;margin-top:2px;font-family:var(--font-head);}
.day-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.day-tab.active .dow{color:rgba(255,255,255,.75);}
.day-tab:disabled{opacity:.35;}
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
.slot-btn{padding:10px 4px;border:1px solid var(--line);border-radius:var(--radius-s);font-size:13px;background:var(--surface);color:var(--ink);min-height:42px;font-weight:600;}
.slot-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary-dark);}
.slot-btn.busy{background:var(--line-soft);color:var(--ink-faint);text-decoration:line-through;cursor:not-allowed;}
.slot-btn.selected{background:var(--primary);border-color:var(--primary);color:#fff;}

.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.tab-btn{padding:12px 16px;font-size:14px;font-weight:700;color:var(--ink-faint);border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font-head);min-height:var(--touch);}
.tab-btn.active{color:var(--primary-dark);border-color:var(--primary);}

.rating-breakdown{display:flex;flex-direction:column;gap:9px;}
.rb-row{display:flex;align-items:center;gap:10px;font-size:13px;}
.rb-label{width:150px;color:var(--ink-soft);flex-shrink:0;}
.rb-bar{flex:1;height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;}
.rb-fill{height:100%;background:var(--accent);}
.rb-val{width:26px;text-align:right;font-weight:700;}

.symptom-page{max-width:720px;margin:0 auto;padding:40px 20px 70px;}
.symptom-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:22px;box-shadow:var(--shadow-card);}
textarea{width:100%;min-height:120px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-s);font-family:inherit;font-size:14.5px;resize:vertical;background:var(--bg);color:var(--ink);}
textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;background:var(--surface);}

function pickReviewName(entityId, i){
  // Separately-salted seed per review so names don't cluster on the first
  // RNG output (small seeds otherwise correlate and over-favor one name).
  const nameRnd = seededRandom(hashStr(entityId+'-name-'+i));
  nameRnd(); nameRnd(); nameRnd();
  return REVIEW_NAMES[Math.floor(nameRnd()*REVIEW_NAMES.length)];
}
function reviewsFor(entityId, count){
  const rnd = seededRandom(hashStr(entityId));
  const out = [];
  for(let i=0;i<count;i++){
    const name = pickReviewName(entityId, i);
    const text = REVIEW_TEXTS[Math.floor(rnd()*REVIEW_TEXTS.length)];
    const day = 1 + Math.floor(rnd()*27);
    const monthIdx = Math.floor(rnd()*9);
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября'];
    const overall = Math.round((4 + rnd()*1)*2)/2;
    out.push({
      name, text, date: day+' '+months[monthIdx]+' 2026',
      overall: overall > 5 ? 5 : overall,
      treatment: Math.min(5, Math.round((overall + (rnd()-0.5)*0.8)*2)/2),
      attitude: Math.min(5, Math.round((overall + (rnd()-0.5)*0.8)*2)/2),
      wait: Math.min(5, Math.round((overall - rnd()*1.2)*2)/2),
      expectation: Math.min(5, Math.round((overall + (rnd()-0.5)*0.6)*2)/2),
      explanation: Math.min(5, Math.round((overall + (rnd()-0.5)*0.7)*2)/2),
      priceValue: Math.min(5, Math.round((overall - rnd()*0.9)*2)/2),
      recommend: Math.min(5, Math.round((overall + (rnd()-0.3)*0.5)*2)/2),
      verified: rnd() < 0.78,
    });
  }
  return out;
}

const WEEKDAYS = ['вс','пн','вт','ср','чт','пт','сб'];
function nextNDates(n){
  const out = [];
  const today = new Date();
  for(let i=0;i<n;i++){
    const d = new Date(today); d.setDate(today.getDate()+i);
    out.push(d);
  }
  return out;
}
function dateKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function formatDateHuman(d){
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate()+' '+months[d.getMonth()];
}
function slotsForDoctorDate(doctorId, d){
  const rnd = seededRandom(hashStr(doctorId+dateKey(d)));
  const slots = [];
  for(let h=9; h<18; h++){
    for(let m of [0,30]){
      const busy = rnd() < 0.38;
      slots.push({time: String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'), busy});
    }
  }
  return slots;
}
function firstFreeSlotLabel(doctorId){
  const dates = nextNDates(5);
  for(const d of dates){
    const slots = slotsForDoctorDate(doctorId, d);
    const free = slots.find(s=>!s.busy);
    if(free){
      const isToday = dateKey(d)===dateKey(new Date());
      return (isToday? 'Сегодня, ' : formatDateHuman(d)+', ') + free.time;
    }
  }
  return 'по запросу';
}
function firstFreeSlot(doctorId){
  const dates = nextNDates(14);
  for(const d of dates){
    const slots = slotsForDoctorDate(doctorId, d);
    const free = slots.find(s=>!s.busy);
    if(free) return {date: d, dateKey: dateKey(d), time: free.time};
  }
  return null;
}
function earliestForSpec(specId){
  const docs = DOCTORS.filter(d=>d.spec===specId);
  const rows = docs.map(function(d){
    const slot = firstFreeSlot(d.id);
    return {doctor:d, slot:slot};
  }).filter(function(r){ return r.slot; });
  rows.sort(function(a,b){
    const ak = a.slot.dateKey+' '+a.slot.time, bk = b.slot.dateKey+' '+b.slot.time;
    if(a.slot.date.getTime() !== b.slot.date.getTime()) return a.slot.date - b.slot.date;
    return a.slot.time.localeCompare(b.slot.time);
  });
  return rows;
}

    if(answers.fever==='high'){ score.therapist = (score.therapist||0) + 1.2; }
    if(answers.duration==='long'){ Object.keys(score).forEach(function(k){ if(k!=='therapist') score[k]+=0.6; }); }
    if(answers.severity==='severe'){ Object.keys(score).forEach(function(k){ score[k]+=0.4; }); }
  }
  let entries = Object.entries(score).sort((a,b)=>b[1]-a[1]);
  if(entries.length === 0){ return ['therapist']; }
  return entries.slice(0,2).map(e=>e[0]);
}

/* ---------------- Waiting list ---------------- */
function isOnWaitlist(doctorId){ return state.waitlist.some(function(w){ return w.doctorId===doctorId && !w.cancelled; }); }
function joinWaitlist(doctorId, note){
  if(isOnWaitlist(doctorId)) return;
  state.waitlist.push({id:'WL-'+Math.floor(100000+Math.random()*899999), doctorId:doctorId, note: note||'', createdAt: Date.now()});
  saveState();
}
function leaveWaitlist(entryId){
  const w = state.waitlist.find(function(x){ return x.id===entryId; });
  if(w){ w.cancelled = true; saveState(); }
}
function waitlistSlotOpened(entry){
  // Deterministic simulated "an earlier slot opened up" check, stable per entry.
  const rnd = seededRandom(hashStr(entry.id+'-opened'));
  return rnd() < 0.55;
}
function waitlistOpenedLabel(entry){
  const rnd = seededRandom(hashStr(entry.id+'-openedtime'));
  const dates = nextNDates(3);
  const d = dates[Math.floor(rnd()*dates.length)];
  const hour = 9 + Math.floor(rnd()*8);
  const min = rnd()<0.5?'00':'30';
  const isToday = dateKey(d)===dateKey(new Date());
  return (isToday?'Сегодня, ':formatDateHuman(d)+', ')+String(hour).padStart(2,'0')+':'+min;
}

function clinicOverride(clinicId){
  if(!state.clinicAdminOverrides[clinicId]) state.clinicAdminOverrides[clinicId] = {addedDoctors:[], removedDoctorIds:[], doctorEdits:{}, schedule:null};
  return state.clinicAdminOverrides[clinicId];
}
function effectiveDoctorsByClinic(cid){
  const ov = state.clinicAdminOverrides[cid];
  let list = doctorsByClinic(cid);
  if(ov){
    if(ov.removedDoctorIds && ov.removedDoctorIds.length) list = list.filter(function(d){ return ov.removedDoctorIds.indexOf(d.id)===-1; });
    if(ov.doctorEdits) list = list.map(function(d){ return ov.doctorEdits[d.id] ? Object.assign({}, d, ov.doctorEdits[d.id]) : d; });
    if(ov.addedDoctors && ov.addedDoctors.length) list = list.concat(ov.addedDoctors);
  }
  return list;
}
function effectiveClinicSchedule(c){
  const ov = state.clinicAdminOverrides[c.id];
  if(ov && ov.schedule) return ov.schedule;
  return {openDays: c.openDays, openFrom: c.openFrom, openTo: c.openTo, workDays: c.workDays, workHours: c.workHours};
}

function parseQuery(qs){
  const out = {};
  if(!qs) return out;
  qs.replace(/^\?/, '').split('&').forEach(p=>{
    if(!p) return;
    const [k,v] = p.split('=');
    out[decodeURIComponent(k)] = decodeURIComponent(v||'');
  });
  return out;
}

const symptomWizard = {step:1, text:'', answers:{duration:null, fever:null, severity:null}, redFlag:false};
function resetSymptomWizard(){
  symptomWizard.step=1; symptomWizard.text=''; symptomWizard.redFlag=false;
  symptomWizard.answers={duration:null, fever:null, severity:null};
}
function pageSymptomChecker(){
  resetSymptomWizard();
  return '<div class="page-head"><div class="container">'
    + '<div class="breadcrumb"><a href="#/">Главная</a> / AI Symptom Checker</div>'
    + '<h1 style="font-size:25px;">Не знаете, к какому врачу обратиться?</h1>'
    + '<p style="color:var(--ink-soft);font-size:14px;margin-top:6px;">Опишите симптомы, ответьте на пару уточняющих вопросов — получите направление, куда обратиться.</p>'
  + '</div></div>'
  + '<div class="symptom-page"><div class="symptom-box" id="symptom-wizard">'+renderSymptomStep()+'</div></div>';
}
function symptomStepper(){
  const labels=['Симптомы','Уточнение','Рекомендация'];
  return '<div class="stepper" style="margin-bottom:22px;">'+labels.map((l,i)=>{
    const n=i+1; const cls=n<symptomWizard.step?'done':(n===symptomWizard.step?'active':'');
    return '<div class="step '+cls+'"><div class="snum">Шаг '+n+'</div><div class="slabel">'+l+'</div></div>';
  }).join('')+'</div>';
}
function choiceGroup(key,label,options,selected){
  return '<div class="form-row"><label style="margin-bottom:9px;">'+label+'</label><div style="display:flex;gap:8px;flex-wrap:wrap;">'
    + options.map(function(o){ return '<button type="button" class="filter-toggle symptom-choice '+(selected===o[0]?'active':'')+'" aria-pressed="'+(selected===o[0])+'" data-qkey="'+key+'" data-qval="'+o[0]+'">'+o[1]+'</button>'; }).join('')
  + '</div></div>';
}
function urgentRedFlagBlock(){
  return '<div class="disclaimer" style="background:var(--danger-tint);border-color:var(--danger);align-items:flex-start;">'
    + icon('siren',{size:22,cls:'ic',decorative:false})
    + '<div><b style="display:block;color:var(--danger);font-family:var(--font-head);margin-bottom:4px;">Похоже на состояние, которое требует срочной помощи</b>'
    + 'Мы не ставим диагноз по описанию — но такие признаки требуют немедленной оценки врача. Пожалуйста, позвоните <b>103</b> (скорая помощь) или обратитесь в ближайшее приёмное отделение прямо сейчас.</div>'
  + '</div>'
  + '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">'
    + '<a class="btn btn-accent" href="tel:103">'+icon('phone',{size:16})+'Позвонить 103</a>'
    + '<a class="btn btn-outline" href="#/urgent-care">'+icon('siren',{size:16})+'Открыть «Срочная помощь»</a>'
    + '<button class="btn btn-ghost" data-action="symptom-back">Это не экстренный случай, вернуться назад</button>'
  + '</div>';
}
function renderSymptomStep(){
  if(symptomWizard.step===1){
    return symptomStepper()
      + '<label for="symptom-input" style="display:block;font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;">Опишите, что вас беспокоит, своими словами</label>'
      + '<textarea id="symptom-input" placeholder="Например: у меня болит горло уже три дня, сложно глотать и иногда поднимается температура">'+symptomWizard.text+'</textarea>'
      + '<button class="btn btn-accent" style="margin-top:14px;" data-action="symptom-next-1">Продолжить</button>'
      + '<div class="disclaimer" role="note">'+icon('alert',{size:18,cls:'ic'})+'<span>Этот инструмент не ставит диагноз и не заменяет консультацию врача. При сильных или опасных симптомах немедленно обратитесь за медицинской помощью — звоните 103.</span></div>';
  }
  if(symptomWizard.step===2){
    if(symptomWizard.redFlag) return symptomStepper()+urgentRedFlagBlock();
    const a = symptomWizard.answers;
    return symptomStepper()
      + '<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;">Ответьте на несколько уточняющих вопросов — это поможет точнее подобрать направление.</p>'
      + choiceGroup('duration','Как долго это продолжается?', [['short','Менее суток'],['mid','1–3 дня'],['long','Больше недели']], a.duration)
      + choiceGroup('fever','Температура тела повышена?', [['none','Нет, в норме'],['mild','Небольшая (до 38°C)'],['high','Высокая (выше 38°C)']], a.fever)
      + choiceGroup('severity','Насколько выражены симптомы?', [['mild','Слабо, не мешают жить'],['moderate','Умеренно, мешают привычным делам'],['severe','Сильно, тяжело терпеть']], a.severity)
      + '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-outline" data-action="symptom-back">Назад</button><button class="btn btn-accent" style="flex:1;" data-action="symptom-next-2" '+(!(a.duration&&a.fever&&a.severity)?'disabled':'')+'>Получить рекомендацию</button></div>';
  }
  return symptomStepper() + renderSymptomResult();
}
function renderSymptomResult(){
  const specs = analyzeSymptoms(symptomWizard.text, symptomWizard.answers);
  const names = specs.map(s=>specName(s)).join(' или ');
  return '<div class="symptom-result" style="border-top:none;padding-top:0;margin-top:0;">'
    + '<p style="font-size:14px;color:var(--ink-soft);margin-bottom:12px;">По описанным симптомам можно рассмотреть консультацию: <b style="color:var(--ink);">'+names+'</b>.</p>'
    + specs.map(s=>'<div class="result-spec"><span class="l">'+icon(specIconName(s),{size:18})+specName(s)+'</span><span style="display:flex;gap:8px;flex-wrap:wrap;"><a class="btn btn-outline btn-sm" href="#/earliest?spec='+s+'">'+icon('clock',{size:14})+'Ближайшее время</a><a class="btn btn-primary btn-sm" href="#/doctors?spec='+s+'">Найти '+specName(s).toLowerCase()+'а</a></span></div>').join('')
    + '<p style="font-size:12.5px;color:var(--ink-faint);margin-top:12px;">Это предварительная информационная подсказка на основе указанных симптомов, а не медицинское заключение. Если состояние ухудшается — обратитесь к врачу очно.</p>'
    + '<button class="btn btn-outline btn-sm" style="margin-top:10px;" data-action="symptom-restart">Начать заново</button>'
  + '</div>';
}
function bindSymptomWizard(){
  const root = document.getElementById('symptom-wizard');
  if(!root) return;
  const next1 = root.querySelector('[data-action="symptom-next-1"]');
  if(next1){
    next1.addEventListener('click', function(){
      const val = document.getElementById('symptom-input').value.trim();
      if(!val){ showToast('Опишите симптомы, чтобы продолжить'); return; }
      symptomWizard.text = val;
      symptomWizard.redFlag = hasRedFlags(val);
      symptomWizard.step = 2;
      rerenderSymptomWizard();
    });
  }
  root.querySelectorAll('.symptom-choice').forEach(btn=>{
    btn.addEventListener('click', function(){
      symptomWizard.answers[btn.getAttribute('data-qkey')] = btn.getAttribute('data-qval');
      rerenderSymptomWizard();
    });
  });
  const back = root.querySelector('[data-action="symptom-back"]');
  if(back){ back.addEventListener('click', function(){ symptomWizard.step = 1; symptomWizard.redFlag=false; rerenderSymptomWizard(); }); }
  const next2 = root.querySelector('[data-action="symptom-next-2"]');
  if(next2){ next2.addEventListener('click', function(){ symptomWizard.step = 3; rerenderSymptomWizard(); }); }
  const restart = root.querySelector('[data-action="symptom-restart"]');
  if(restart){ restart.addEventListener('click', function(){ resetSymptomWizard(); rerenderSymptomWizard(); }); }
}
function rerenderSymptomWizard(){
  const root = document.getElementById('symptom-wizard');
  if(!root) return;
  root.innerHTML = renderSymptomStep();
  bindSymptomWizard();
}

        + '<div class="form-row"><label for="p-cm">Комментарий для врача (необязательно)</label><input id="p-cm" type="text" name="comment" value="'+(p.comment||'')+'" placeholder="Кратко опишите причину визита"></div>'
        + '<div class="form-row" style="background:var(--primary-tint);border-radius:var(--radius-m);padding:12px 14px;">'

        + '<div class="sr"><span class="k">Специальность</span><span class="v">'+specName(d.spec)+'</span></div>'
        + '<div class="sr"><span class="k">Клиника</span><span class="v">'+clinic.name+'</span></div>'
        + '<div class="sr"><span class="k">Адрес</span><span class="v">'+clinic.addr+'</span></div>'
        + '<div class="sr"><span class="k">Дата и время</span><span class="v">'+formatDraftDate(draft.date)+', '+draft.time+'</span></div>'
        + '<div class="sr"><span class="k">Пациент</span><span class="v">'+p.firstName+' '+p.lastName+'</span></div>'
        + '<div class="sr"><span class="k">Телефон</span><span class="v">'+p.phone+'</span></div>'
        + '<div class="sr"><span class="k">Доступ врачу</span><span class="v">'+(grants.length?grants.join(', '):'Не предоставлен')+'</span></div>'
        + '<div class="sr"><span class="k">Стоимость</span><span class="v" style="font-weight:700;">'+d.price.toLocaleString('ru-RU')+' ₸</span></div>'
      + '</div>'

    + '</div>';
  }

  return '<div class="booking-wrap">'+stepperHtml+body+'</div>';

function formatDraftDate(key){
  if(!key) return '';
  const parts = key.split('-');
  return formatDateHuman(new Date(parts[0],parts[1]-1,parts[2]));
}

function consentSummary(b){
  const c = b.patient && b.patient.consent;

  return grants.join(', ');
}

function statusOf(b){
  const now = new Date();
  const bd = new Date(b.date.split('-')[0], b.date.split('-')[1]-1, b.date.split('-')[2]);
  const [h,m] = b.time.split(':').map(Number);
  bd.setHours(h,m);
  if(b.cancelled) return 'cancelled';
  return bd < now ? 'done' : 'upcoming';
}
function cabAppointments(){
  if(!state.bookings.length) return emptyCab('calendar','Пока нет записей','Найдите врача и запишитесь на приём — он появится здесь.', '#/doctors','Найти врача');
  const sorted = [...state.bookings].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  return sorted.map(b=>{
    const d = doctorById(b.doctorId); const clinic = clinicById(d.clinic);
    const st = statusOf(b);
    const label = st==='upcoming'?'Предстоящая':(st==='done'?'Завершена':'Отменена');
    return '<div class="appt-card">'
      + initialsAvatar(d.initials, d.color, 52)
      + '<div style="flex:1;">'
        + '<div style="display:flex;justify-content:space-between;gap:10px;"><div class="doc-name">'+d.name+'</div><span class="status-badge status-'+st+'">'+label+'</span></div>'
        + '<div class="doc-spec">'+specName(d.spec)+' · '+clinic.name+'</div>'
        + '<div style="font-size:13px;color:var(--ink-soft);margin-top:6px;display:flex;align-items:center;gap:5px;">'+icon('calendar',{size:14})+formatDraftDate(b.date)+', '+b.time+' · №'+b.id+'</div>'
        + (consentSummary(b) ? '<div style="font-size:12px;color:var(--ink-faint);margin-top:3px;">Доступ врачу: '+consentSummary(b)+'</div>' : '')
        + (st==='upcoming' ? '<div style="margin-top:10px;display:flex;gap:8px;"><button class="btn btn-outline btn-sm" data-action="cancel-booking" data-id="'+b.id+'">Отменить</button><a class="btn btn-outline btn-sm" href="#/booking/'+d.id+'">Перенести</a></div>' : '')
        + (st==='done' ? '<div style="margin-top:10px;"><button class="btn btn-outline btn-sm" data-action="open-review-modal" data-doctor="'+d.id+'" data-verified="true">Оставить отзыв</button></div>' : '')
      + '</div>'
    + '</div>';
  }).join('');
}

function bindMedCard(){
  const tabsRoot = document.getElementById('medcard-tabs');
  if(!tabsRoot) return;
  tabsRoot.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      medCardState.tab = btn.getAttribute('data-medtab');
      tabsRoot.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b===btn); b.setAttribute('aria-selected', b===btn); });
      const content = document.getElementById('medcard-content');
      content.innerHTML = renderMedCardTab();
      bindMedCardContent();
    });
  });
  bindMedCardContent();
}
function bindMedCardContent(){
  const content = document.getElementById('medcard-content');
  if(!content) return;
  const addForm = content.querySelector('#add-allergy-form');
  if(addForm){
    addForm.addEventListener('submit', function(e){
      e.preventDefault();
      const fd = new FormData(addForm);
      const val = (fd.get('allergy')||'').toString().trim();
      if(!val) return;
      state.medProfile.allergies.push(val);
      saveState();
      content.innerHTML = renderMedCardTab();
      bindMedCardContent();
      showToast('Добавлено');
    });
  }
  content.querySelectorAll('[data-action="remove-allergy"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.medProfile.allergies.splice(Number(btn.getAttribute('data-idx')),1);
      saveState();
      content.innerHTML = renderMedCardTab();
      bindMedCardContent();
    });
  });

function clinicAdminAppointmentsTab(c){
  const docs = doctorsByClinic(c.id);
  const real = state.bookings.filter(function(b){ const d = doctorById(b.doctorId); return d && d.clinic===c.id; })
    .map(function(b){ return Object.assign({}, b, {patientName: b.patient ? (b.patient.firstName+' '+b.patient.lastName) : (state.user?state.user.name:'Пациент')}); });
  const rnd = seededRandom(hashStr(c.id+'-admin-appts'));
  const dates = nextNDates(6);
  const synth = [];
  if(docs.length){
    for(let i=0;i<8;i++){
      const doc = docs[Math.floor(rnd()*docs.length)];
      const date = dates[Math.floor(rnd()*dates.length)];
      const hour = 9+Math.floor(rnd()*8);
      const min = rnd()<0.5?'00':'30';
      synth.push({id:'SYN-'+(i+1), doctorId:doc.id, patientName: pickReviewName(c.id+'-appt', i), date: dateKey(date), time: String(hour).padStart(2,'0')+':'+min});
    }
  }
  const all = real.concat(synth).sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
  if(!all.length) return '<h3 style="font-size:17px;margin-bottom:14px;">Записи</h3><p style="color:var(--ink-faint);font-size:14px;">Записей пока нет.</p>';

}

    + '<form id="ca-doctor-form" style="margin-top:12px;">'
      + '<div class="form-row"><label for="ca-d-name">Имя врача</label><input id="ca-d-name" type="text" name="name" value="'+(existing?existing.name:'')+'" required></div>'
      + '<div class="form-row"><label for="ca-d-spec">Специальность</label><select id="ca-d-spec" name="spec">'+SPECIALTIES.map(function(s){ return '<option value="'+s.id+'" '+(existing&&existing.spec===s.id?'selected':'')+'>'+s.name+'</option>'; }).join('')+'</select></div>'
      + '<div class="form-row-2"><div class="form-row"><label for="ca-d-exp">Стаж (лет)</label><input id="ca-d-exp" type="number" min="0" name="exp" value="'+(existing?existing.exp:5)+'"></div><div class="form-row"><label for="ca-d-price">Цена приёма (₸)</label><input id="ca-d-price" type="number" min="0" name="price" value="'+(existing?existing.price:8000)+'"></div></div>'
      + '<button class="btn btn-primary btn-block" type="submit">Сохранить</button>'
      + '<button class="btn btn-ghost btn-block" type="button" id="ca-doctor-cancel">Отмена</button>'
    + '</form>'
  + '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#ca-doctor-cancel').addEventListener('click', function(){ overlay.remove(); });
  overlay.querySelector('#ca-doctor-form').addEventListener('submit', function(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = fd.get('name').toString().trim();
    const spec = fd.get('spec');
    const exp = Number(fd.get('exp'))||0;
    const price = Number(fd.get('price'))||0;
    const ov = clinicOverride(clinicId);
    if(existing && existing.id.indexOf('adm-')===0){
      const added = ov.addedDoctors.find(function(d){ return d.id===existing.id; });
      if(added){ added.name=name; added.spec=spec; added.exp=exp; added.price=price; added.initials = name.split(' ').slice(0,2).map(function(p){return p[0];}).join(''); }
    } else if(existing){
      ov.doctorEdits[existing.id] = {name:name, spec:spec, exp:exp, price:price};
    } else {
      const initials = name.split(' ').slice(0,2).map(function(p){return p[0];}).join('') || 'ВР';
      ov.addedDoctors.push({
        id: 'adm-'+Date.now(), name: name, spec: spec, clinic: clinicId, exp: exp, rating: 4.5, reviews: 0,
        price: price, langs:['рус'], edu:'Указывается администратором клиники', about:'Добавлено администратором клиники (демо).',
        initials: initials, color: AVATAR_COLORS[hashStr(name)%AVATAR_COLORS.length], formats:['Очно'],
      });
    }
    saveState(); overlay.remove(); showToast('Сохранено'); render();
  });
}

/* ---------------- Router ---------------- */
function parseHash(){
  const raw = location.hash.slice(1) || '/';
  const [path, qs] = raw.split('?');
  return {path: path||'/', query: parseQuery(qs)};
}
function render(){
  const {path, query} = parseHash();
  const parts = path.split('/').filter(Boolean);
  let html = '';
  let routeKey = '#/'+ (parts[0]||'');

  if(parts.length===0){ html = pageHome(); routeKey='#/'; }
  else if(parts[0]==='doctors'){ html = pageDoctors(query); routeKey='#/doctors'; }
  else if(parts[0]==='clinics'){ html = pageClinics(query); routeKey='#/clinics'; }
  else if(parts[0]==='compare'){ html = pageCompare(query); routeKey='#/compare'; }
  else if(parts[0]==='urgent-care'){ html = pageUrgentCare(); routeKey='#/urgent-care'; }
  else if(parts[0]==='doctor' && parts[1]){ html = pageDoctor(parts[1]); routeKey=''; }
  else if(parts[0]==='clinic' && parts[1]){ html = pageClinic(parts[1]); routeKey=''; }
  else if(parts[0]==='symptom-checker'){ html = pageSymptomChecker(); routeKey='#/symptom-checker'; }
  else if(parts[0]==='booking' && parts[1]){ html = pageBooking(parts[1], parts[2]?Number(parts[2]):1); routeKey=''; }
  else if(parts[0]==='booking-confirmed' && parts[1]){ html = pageBookingConfirmed(parts[1]); routeKey=''; }
  else if(parts[0]==='cabinet'){ html = pageCabinet(parts[1]); routeKey='#/cabinet'; }
  else if(parts[0]==='favorites'){ html = pageFavorites(); routeKey=''; }
  else if(parts[0]==='compare-doctors'){ html = pageCompareDoctors(query); routeKey=''; }
  else if(parts[0]==='earliest'){ html = pageEarliest(query); routeKey=''; }
  else if(parts[0]==='clinic-admin'){ html = pageClinicAdmin(parts, query); routeKey=''; }
  else { html = pageHome(); routeKey='#/'; }

  document.getElementById('app').innerHTML = renderHeader(routeKey) + '<main id="main">'+html+'</main>' + renderFooter();
  window.scrollTo(0,0);
  bindPageEvents(parts, query);
  updateCompareTray();
}

/* ---------------- Event binding (delegated + page-specific) ---------------- */
function bindPageEvents(parts, query){
  const app = document.getElementById('app');

  const heroForm = app.querySelector('[data-action="hero-search"]');
  if(heroForm){
    heroForm.addEventListener('submit', function(e){
      e.preventDefault();
      const q = heroForm.querySelector('input[name=q]').value.trim();
      location.hash = '#/doctors?q='+encodeURIComponent(q);
    });
  }

  const filtersBar = document.getElementById('doc-filters');
  if(filtersBar){
    const ids = ['f-q','f-spec','f-clinic','f-district','f-price','f-exp','f-rating','f-lang','f-sort'];
    ids.forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      const evt = (id==='f-q') ? 'input' : 'change';
      el.addEventListener(evt, function(){
        doctorFilterState.q = document.getElementById('f-q').value;
        doctorFilterState.spec = document.getElementById('f-spec').value;
        doctorFilterState.clinic = document.getElementById('f-clinic').value;
        doctorFilterState.district = document.getElementById('f-district').value;
        doctorFilterState.maxPrice = document.getElementById('f-price').value;
        doctorFilterState.minExp = document.getElementById('f-exp').value;
        doctorFilterState.minRating = document.getElementById('f-rating').value;
        doctorFilterState.lang = document.getElementById('f-lang').value;
        doctorFilterState.sort = document.getElementById('f-sort').value;
        rerenderDoctorsListOnly();
      });
    });
    const onlineBtn = document.getElementById('f-online');
    if(onlineBtn){
      onlineBtn.addEventListener('click', function(){
        doctorFilterState.format = doctorFilterState.format==='Онлайн' ? '' : 'Онлайн';
        rerenderDoctorsListOnly();
      });
    }
  }

  const clinicFilters = document.getElementById('clinic-filters');
  if(clinicFilters){
    ['cf-district','cf-spec','cf-price'].forEach(function(id){
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('change', function(){
        clinicFilterState.district = document.getElementById('cf-district').value;
        clinicFilterState.spec = document.getElementById('cf-spec').value;
        clinicFilterState.maxPrice = document.getElementById('cf-price').value;
        rerenderClinicsOnly();
      });
    });
    const openBtn = document.getElementById('cf-open');
    if(openBtn) openBtn.addEventListener('click', function(){ clinicFilterState.openNow = !clinicFilterState.openNow; rerenderClinicsOnly(); });
    const todayBtn = document.getElementById('cf-today');
    if(todayBtn) todayBtn.addEventListener('click', function(){ clinicFilterState.todaySlot = !clinicFilterState.todaySlot; rerenderClinicsOnly(); });
  }

  const docTabs = document.getElementById('doc-tabs');
  if(docTabs && parts[0]==='doctor'){
    const d = doctorById(parts[1]);
    docTabs.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', function(){
        docTabs.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false');});
        btn.classList.add('active'); btn.setAttribute('aria-selected','true');
        const tab = btn.getAttribute('data-tab');
        const content = document.getElementById('doc-tab-content');
        if(tab==='about') content.innerHTML = docTabAbout(d, clinicById(d.clinic));
        else if(tab==='schedule'){ pageDoctor._selDate=null; content.innerHTML = docTabSchedule(d); bindScheduleTab(d); }
        else if(tab==='reviews') content.innerHTML = docTabReviews(d);
        else if(tab==='clinic') content.innerHTML = docTabClinic(d);
        bindGlobalActions(content);
      });
    });
  }

  if(parts[0]==='symptom-checker'){ bindSymptomWizard(); }
  if(parts[0]==='urgent-care'){ bindUrgentCare(); }
  if(parts[0]==='cabinet' && parts[1]==='medcard'){ bindMedCard(); }
  const compareSelect = document.getElementById('compare-service');
  if(compareSelect){
    compareSelect.addEventListener('change', function(){
      location.hash = '#/compare?service='+encodeURIComponent(compareSelect.value);
    });
  }
  const earliestSelect = document.getElementById('earliest-spec');
  if(earliestSelect){
    earliestSelect.addEventListener('change', function(){
      location.hash = '#/earliest'+(earliestSelect.value?'?spec='+encodeURIComponent(earliestSelect.value):'');
    });
  }

  if(parts[0]==='clinic-admin'){
    const loginForm = document.getElementById('clinic-admin-login');
    if(loginForm){
      loginForm.addEventListener('submit', function(e){
        e.preventDefault();
        const clinicId = document.getElementById('ca-clinic').value;
        state.clinicAdminSession = clinicId; saveState();
        location.hash = '#/clinic-admin/'+clinicId+'/doctors';
      });
    }
    app.querySelectorAll('[data-action="ca-add-doctor"]').forEach(function(btn){
      btn.addEventListener('click', function(){ caDoctorModal(btn.getAttribute('data-clinic'), null); });
    });
    app.querySelectorAll('[data-action="ca-edit-doctor"]').forEach(function(btn){
      btn.addEventListener('click', function(){ caDoctorModal(btn.getAttribute('data-clinic'), btn.getAttribute('data-doctor')); });
    });
    app.querySelectorAll('[data-action="ca-remove-doctor"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        const clinicId = btn.getAttribute('data-clinic'), doctorId = btn.getAttribute('data-doctor');
        const ov = clinicOverride(clinicId);
        if(doctorId.indexOf('adm-')===0){ ov.addedDoctors = ov.addedDoctors.filter(function(d){ return d.id!==doctorId; }); }
        else if(ov.removedDoctorIds.indexOf(doctorId)===-1){ ov.removedDoctorIds.push(doctorId); }
        saveState(); showToast('Врач удалён из списка клиники'); render();
      });
    });
    const scheduleForm = document.getElementById('ca-schedule-form');
    if(scheduleForm){
      scheduleForm.addEventListener('submit', function(e){
        e.preventDefault();
        const clinicId = scheduleForm.getAttribute('data-clinic');
        const fd = new FormData(scheduleForm);
        const days = fd.getAll('day').map(Number);
        const openFrom = Number(fd.get('openFrom'));
        const openTo = Number(fd.get('openTo'));
        const ov = clinicOverride(clinicId);
        ov.schedule = {openDays: days, openFrom: openFrom, openTo: openTo, workDays: days.length+' дней в неделю', workHours: String(openFrom).padStart(2,'0')+':00–'+String(openTo).padStart(2,'0')+':00'};
        saveState(); showToast('Расписание сохранено'); render();
      });
    }
    app.querySelectorAll('[data-action="clinic-admin-exit"]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        state.clinicAdminSession = null; saveState();
        location.hash = '#/';
      });
    });
  }

  if(parts[0]==='booking' && parts[1]){
    const doctorId = parts[1];
    const dayTabs = document.getElementById('booking-day-tabs');
    if(dayTabs){
      dayTabs.querySelectorAll('.day-tab').forEach(btn=>{
        btn.addEventListener('click', function(){
          state.bookingDraft.date = btn.getAttribute('data-date');
          state.bookingDraft.time = null;
          location.hash = '#/booking/'+doctorId+'/3';
        });
      });
    }
    const slotGrid = document.getElementById('booking-slot-grid');
    if(slotGrid){
      slotGrid.querySelectorAll('.slot-btn:not(.busy)').forEach(btn=>{
        btn.addEventListener('click', function(){
          state.bookingDraft.time = btn.getAttribute('data-slot');
          location.hash = '#/booking/'+doctorId+'/4';
        });
      });
    }
    app.querySelectorAll('[data-action="booking-next"]').forEach(btn=>{
      btn.addEventListener('click', function(){
        const s = Number(btn.getAttribute('data-step'));
        location.hash = '#/booking/'+doctorId+'/'+(s+1);
      });
    });
    const patientForm = document.getElementById('patient-form');
    if(patientForm){
      patientForm.addEventListener('submit', function(e){
        e.preventDefault();
        const fd = new FormData(patientForm);
        state.bookingDraft.patient = {
          firstName: fd.get('firstName'), lastName: fd.get('lastName'),
          phone: fd.get('phone'), birthdate: fd.get('birthdate'), comment: fd.get('comment'),
          consent: {
            allergies: fd.get('consent_allergies')==='on',
            labs: fd.get('consent_labs')==='on',
            prescriptions: fd.get('consent_prescriptions')==='on',
          },
        };
        location.hash = '#/booking/'+doctorId+'/5';
      });
    }
    const confirmBtn = app.querySelector('[data-action="booking-confirm"]');
    if(confirmBtn){
      confirmBtn.addEventListener('click', function(){
        const id = 'MC-'+Math.floor(100000+Math.random()*899999);
        const b = Object.assign({id:id}, state.bookingDraft);
        state.bookings.push(b);
        if(!state.user){ state.user = {name: b.patient.firstName+' '+b.patient.lastName, phone: b.patient.phone}; }
        saveState();
        state.bookingDraft = {};
        location.hash = '#/booking-confirmed/'+id;
      });
    }
  }

  const profileForm = document.getElementById('profile-form');
  if(profileForm){
    profileForm.addEventListener('submit', function(e){
      e.preventDefault();
      const fd = new FormData(profileForm);
      state.user.name = fd.get('name'); state.user.phone = fd.get('phone'); state.user.birthdate = fd.get('birthdate');
      saveState(); showToast('Данные сохранены');
    });
  }
  app.querySelectorAll('[data-notif]').forEach(cb=>{
    cb.addEventListener('change', function(){
      if(!state.user.notif) state.user.notif = {};
      state.user.notif[cb.getAttribute('data-notif')] = cb.checked;
      saveState(); showToast('Настройки обновлены');
    });
  });

  bindGlobalActions(app);
  bindScheduleTab(parts[0]==='doctor' ? doctorById(parts[1]) : null);
}

function bindScheduleTab(d){
  if(!d) return;
  const dayTabs = document.getElementById('day-tabs');
  if(!dayTabs) return;
  dayTabs.querySelectorAll('.day-tab').forEach(btn=>{
    btn.addEventListener('click', function(){
      pageDoctor._selDate = btn.getAttribute('data-date');
      const content = document.getElementById('doc-tab-content');
      content.innerHTML = docTabSchedule(d);
      bindScheduleTab(d);
    });
  });
}

function rerenderDoctorsListOnly(){
  const app = document.getElementById('app');
  const main = app.querySelector('main');
  main.innerHTML = pageDoctors({});
  bindPageEvents(['doctors'], {});
}
function rerenderClinicsOnly(){
  const app = document.getElementById('app');
  const main = app.querySelector('main');
  main.innerHTML = pageClinics({});
  bindPageEvents(['clinics'], {});
}

/* ---------------- Global delegated actions (favorites, modals, theme) ---------------- */
function bindGlobalActions(scope){
  scope.querySelectorAll('[data-action="toggle-fav-doctor"]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.preventDefault();
      toggleFav('doctor', btn.getAttribute('data-id'));
      render();
    });
  });
  scope.querySelectorAll('[data-action="toggle-fav-clinic"]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.preventDefault();
      toggleFav('clinic', btn.getAttribute('data-id'));
      render();
    });
  });
  scope.querySelectorAll('[data-action="toggle-compare-doctor"]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.preventDefault();
      toggleCompare(btn.getAttribute('data-id'));
      render();
    });
  });
  scope.querySelectorAll('[data-action="clear-compare"]').forEach(btn=>{
    btn.addEventListener('click', function(){ clearCompare(); updateCompareTray(); });
  });
  scope.querySelectorAll('[data-action="join-waitlist"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const doctorId = btn.getAttribute('data-doctor');
      joinWaitlist(doctorId);
      showToast('Вы добавлены в лист ожидания');
      const d = doctorById(doctorId);
      const parent = btn.closest('div');
      if(parent) parent.outerHTML = waitlistBlock(d);
      bindGlobalActions(document.getElementById('app'));
    });
  });
  scope.querySelectorAll('[data-action="leave-waitlist"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      leaveWaitlist(btn.getAttribute('data-id'));
      showToast('Вы удалены из листа ожидания');
      render();
    });
  });
  scope.querySelectorAll('[data-action="cancel-booking"]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const id = btn.getAttribute('data-id');
      const b = state.bookings.find(x=>x.id===id);
      if(b){ b.cancelled = true; saveState(); render(); showToast('Запись отменена'); }
    });
  });
  scope.querySelectorAll('[data-action="open-review-modal"]').forEach(btn=>{
    btn.addEventListener('click', function(){ openReviewModal(btn.getAttribute('data-doctor'), btn.getAttribute('data-verified')==='true'); });
  });
  scope.querySelectorAll('[data-action="open-login-modal"]').forEach(btn=>{
    btn.addEventListener('click', function(e){ e.preventDefault(); openAuthModal('login'); });
  });
  scope.querySelectorAll('[data-action="require-auth"]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      if(state.user) return;
      e.preventDefault();
      openAuthModal();
    });
  });
  scope.querySelectorAll('[data-action="open-register-modal"]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.preventDefault();
      openAuthModal('register');
    });
  });
  scope.querySelectorAll('[data-action="logout"]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.preventDefault();
      state.user = null; saveState(); render(); showToast('Вы вышли из аккаунта');
    });
  });
  const themeBtn = scope.querySelector('[data-action="toggle-theme"]');
  if(themeBtn){
    themeBtn.addEventListener('click', function(){
      const root = document.documentElement;
      const cur = root.getAttribute('data-theme');
      root.setAttribute('data-theme', cur==='dark' ? 'light' : 'dark');
      try{ localStorage.setItem('mc_theme', root.getAttribute('data-theme')); }catch(e){}
    });
  }
  const mobileNavBtn = scope.querySelector('[data-action="open-mobile-nav"]');
  if(mobileNavBtn){
    mobileNavBtn.addEventListener('click', function(){
      const rawPath = (location.hash.slice(1) || '/').split('?')[0];
      const firstPart = rawPath.split('/').filter(Boolean)[0];
      openMobileNav('#/'+(firstPart||''));
    });
  }
}

/* ---------------- Modals ---------------- */
function openAuthModal(defaultTab){
  defaultTab = defaultTab || (state.accounts.length ? 'login' : 'register');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.innerHTML = '<div class="modal-box" style="max-width:420px;">'
    + '<div style="display:flex;gap:6px;border-bottom:1px solid var(--line);margin:-4px -4px 0;">'

    + '<form id="login-form-2" style="margin-top:16px;">'
      + '<div class="form-row"><label for="li2-phone">Телефон</label><input id="li2-phone" type="tel" name="phone" required placeholder="+7 7__ ___-__-__"></div>'

      + (state.accounts.length ? '<p style="font-size:12px;color:var(--ink-faint);margin-top:10px;">Демо-доступ: '+state.accounts[0].phone+' / '+state.accounts[0].password+'</p>' : '<p style="font-size:12px;color:var(--ink-faint);margin-top:10px;">Аккаунтов ещё нет — перейдите на вкладку «Регистрация».</p>')
    + '</form>'
    + '<form id="register-form" hidden style="margin-top:16px;">'
      + '<div class="form-row-2"><div class="form-row"><label for="rg-fn">Имя</label><input id="rg-fn" type="text" name="firstName" required></div><div class="form-row"><label for="rg-ln">Фамилия</label><input id="rg-ln" type="text" name="lastName" required></div></div>'
      + '<div class="form-row"><label for="rg-phone">Телефон</label><input id="rg-phone" type="tel" name="phone" required placeholder="+7 7__ ___-__-__"></div>'
      + '<div class="form-row"><label for="rg-email">Email</label><input id="rg-email" type="email" name="email" required placeholder="you@example.com"></div>'
      + '<div class="form-row"><label for="rg-bd">Дата рождения</label><input id="rg-bd" type="date" name="birthdate" required></div>'
      + '<div class="form-row"><label for="rg-pass">Пароль</label><input id="rg-pass" type="password" name="password" required minlength="4" placeholder="Минимум 4 символа"></div>'
      + '<label style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-soft);margin:14px 0;line-height:1.4;"><input type="checkbox" name="consent" required style="margin-top:2px;width:18px;height:18px;flex-shrink:0;">Согласен(-на) на обработку персональных данных в соответствии с политикой конфиденциальности Medify</label>'
      + '<button class="btn btn-accent btn-block" type="submit">Создать аккаунт</button>'
    + '</form>'
    + '<button class="btn btn-ghost btn-block" type="button" id="close-auth" style="margin-top:8px;">Отмена</button>'
  + '</div>';

  const loginForm = overlay.querySelector('#login-form-2');
  const registerForm = overlay.querySelector('#register-form');
  const errBox = overlay.querySelector('#auth-error');
  const tabBtns = overlay.querySelectorAll('.auth-tab-btn');
  function setTab(tab){
    tabBtns.forEach(b=>b.classList.toggle('active', b.getAttribute('data-authtab')===tab));
    loginForm.hidden = tab !== 'login';
    registerForm.hidden = tab !== 'register';
    errBox.hidden = true;

    location.hash = '#/cabinet';
  });

  registerForm.addEventListener('submit', function(e){
    e.preventDefault();
    const fd = new FormData(registerForm);
    const phone = fd.get('phone').trim();
    if(state.accounts.some(a=>a.phone===phone)){ showErr('Аккаунт с таким номером уже зарегистрирован. Войдите во вкладке «Вход».'); setTab('login'); return; }
    const acc = {
      name: (fd.get('firstName')+' '+fd.get('lastName')).trim(),
      phone: phone, email: fd.get('email'), birthdate: fd.get('birthdate'), password: fd.get('password'),
    };
    state.accounts.push(acc);
    state.user = Object.assign({}, acc); delete state.user.password;
    saveState(); overlay.remove(); render(); showToast('Аккаунт создан. Добро пожаловать в Medify!');
    location.hash = '#/cabinet';
  });
}
function openReviewModal(doctorId, verified){
  const d = doctorById(doctorId);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.innerHTML = '<div class="modal-box">'
    + '<h3 style="font-size:18px;">Оценить приём</h3>'
    + '<p style="font-size:13px;color:var(--ink-soft);margin-top:4px;">'+d.name+'</p>'
    + (verified ? '<div class="tag" style="color:var(--ok);background:var(--ok-tint);display:inline-flex;align-items:center;gap:5px;margin-top:8px;">'+icon('shieldCheck',{size:12})+'Отзыв будет отмечен как подтверждённый</div>' : '')
    + '<form id="review-form" style="margin-top:14px;">'
      + ratingField('attitude','Отношение врача')
      + ratingField('wait','Время ожидания')
      + ratingField('explanation','Объяснение диагноза')
      + ratingField('treatment','Качество лечения')
      + ratingField('priceValue','Соответствие цены')
      + ratingField('recommend','Готовы рекомендовать')
      + '<div class="form-row"><label for="rv-text">Комментарий</label><textarea id="rv-text" name="text" style="min-height:70px;" placeholder="Поделитесь впечатлением о приёме"></textarea></div>'
      + '<button class="btn btn-primary btn-block" type="submit">Отправить отзыв</button>'
      + '<button class="btn btn-ghost btn-block" type="button" id="close-review">Отмена</button>'
    + '</form>'
  + '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#close-review').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('#review-form').addEventListener('submit', function(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const now = new Date();
    const attitude=Number(fd.get('attitude')||5), wait=Number(fd.get('wait')||5), explanation=Number(fd.get('explanation')||5),
          treatment=Number(fd.get('treatment')||5), priceValue=Number(fd.get('priceValue')||5), recommend=Number(fd.get('recommend')||5);
    const overall = Math.round(((attitude+wait+explanation+treatment+priceValue+recommend)/6)*2)/2;
    state.myReviews.unshift({
      doctorId: doctorId, text: fd.get('text')||'Без комментария',
      date: now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear(),
      overall: overall, attitude:attitude, wait:wait, explanation:explanation, treatment:treatment, priceValue:priceValue, recommend:recommend, expectation:overall,
      verified: !!verified,
    });
    saveState(); overlay.remove(); showToast('Спасибо за отзыв!'); render();
  });
  function ratingField(name,label){
    return '<div class="form-row"><label for="rv-'+name+'">'+label+'</label><select id="rv-'+name+'" name="'+name+'" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);min-height:44px;"><option value="5">5 — отлично</option><option value="4">4 — хорошо</option><option value="3">3 — нормально</option><option value="2">2 — плохо</option><option value="1">1 — очень плохо</option></select></div>';
  }
}

window.addEventListener('hashchange', render);
render();
